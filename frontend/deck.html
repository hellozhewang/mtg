<main class="deck">
<h1>{{NAME}}</h1>
<p class="sub">{{PIPS}}<span class="cmd">{{COMMANDER}}</span><span class="bracket" data-tip="Power level the deck is built to. Higher brackets allow more Game Changers, land denial and fast combos.">{{BRACKET}}</span>{{TIER}}{{TAG}}</p>
<ul class="stats">
  <li data-tip="Every card in the deck, including the commander. Commander decks are exactly 100."><b>{{TOTAL}}</b>cards</li>
  <li data-tip="{{LANDNOTE}}"><b>{{LANDS}}</b>lands</li>
  <li data-tip="MV = mana value, what a card costs in total. This is the average across the nonland cards, so it says roughly how fast the deck is."><b>{{MV}}</b>avg MV</li>
  <li data-tip="GC = Game Changer, a card on Wizards' list of the most powerful in the format. Bracket 3 allows at most 3, and the commander counts."><b>{{GC}}</b>Game Changers</li>
</ul>
{{GCLIST}}{{WARN}}
<div class="curve" aria-label="Mana curve, nonland cards">
{{CURVE}}</div>

<div class="toolbar">
  <button class="btn" data-view="list" aria-pressed="true">List</button>
  <button class="btn" data-view="gallery" aria-pressed="false">Gallery</button>
{{GUIDEBTN}}  <button class="btn" data-copy>Copy decklist</button>
{{LINKS}}
</div>
<textarea class="rawlist" readonly aria-hidden="true" tabindex="-1">{{RAWLIST}}</textarea>

{{GUIDE}}<div class="cards" data-view="list">
{{SECTIONS}}</div>
</main>

<template data-part="links">
  <a class="btn" href="{{RAW}}" target="_blank" rel="noopener">Plain text &#8599;</a>
  <a class="btn" href="{{BLOB}}" target="_blank" rel="noopener">On GitHub &#8599;</a>
</template>

<template data-part="private-note">
  <span class="btn btn-off" data-tip="This deck has not been pushed, so there is nothing to link to on GitHub. Copy decklist still works — the list is in this page.">Not on GitHub</span>
</template>

<template data-part="tag"><span class="chip private" data-tip="Not published. This deck lives in private/ and appears only in the local build of this site.">private</span></template>

<template data-part="gclist">
<p class="gclist">{{NAMES}}</p>
</template>

<template data-part="gcname"><span class="gcname" data-tip="Game Changer — one of the format's most powerful cards. Bracket 3 allows 3.">{{NAME}}</span></template>

<template data-part="warn">
<p class="warn">Not resolved on Scryfall: {{NAMES}}</p>
</template>

<template data-part="bar">
  <span class="bar" title="{{N}} cards at mana value {{MV}}"><span class="fill" style="height:{{PCT}}%"></span><span class="n">{{LABEL}}</span><span class="mv">{{MV}}</span></span>
</template>

<template data-part="section">
<section class="cat">
  <h2>{{NAME}} <span class="count">{{N}}</span></h2>
  <ul class="cardlist">
{{CARDS}}  </ul>
</section>
</template>

<template data-part="card">
    <li class="{{CLASS}}" data-name="{{NAME}}"{{DATA}} tabindex="0"><span class="qty">{{QTY}}</span><span class="cname">{{NAME}}</span>{{GCFLAG}}<span class="cost">{{COST}}</span></li>
</template>

<template data-part="guidebtn">  <button class="btn" data-view="guide" aria-pressed="false">Guide</button>
</template>

<template data-part="guide">
<article class="guide" hidden>
  <div class="guide-actions" role="group" aria-label="Guide sections">
    <button class="btn" type="button" data-guide-sections="expand">Expand all</button>
    <button class="btn" type="button" data-guide-sections="collapse">Collapse all</button>
  </div>
{{SECTIONS}}</article>
</template>

<!-- Titled sections collapse like the catalog's bracket groups, open by default.
     The untitled intro is a plain section: a <details> with no <summary> would
     render the browser's own "Details" label. -->
<template data-part="guide-section">
  <details class="gsec" open>
{{TITLE}}{{ROWS}}  </details>
</template>

<template data-part="guide-intro">
  <section class="gsec">
{{ROWS}}  </section>
</template>

<template data-part="guide-title">    <summary class="gsec-heading"><h2>{{TEXT}}</h2></summary>
</template>

<template data-part="guide-prose">    <p class="gprose">{{TEXT}}</p>
</template>

<template data-part="guide-card">    <div class="gcard" data-name="{{NAME}}"{{DATA}}>{{IMG}}<div class="gbody"><span class="gname">{{NAME}}</span><span class="gcost">{{COST}}</span><p class="gnote">{{NOTE}}</p></div></div>
</template>

<!-- A row naming several cards: "A + B" (a combo) or "A -> B" (a tutor line).
     Each piece carries its own data-img, so hover and click show that card. -->
<template data-part="guide-combo">    <div class="gcard gcombo"><div class="gpieces">{{PIECES}}</div><div class="gbody"><span class="gname">{{NAMES}}</span><p class="gnote">{{NOTE}}</p></div></div>
</template>

<template data-part="guide-piece"><span class="gpiece" data-name="{{NAME}}"{{DATA}} tabindex="0">{{IMG}}</span></template>

<template data-part="guide-join"><span class="gjoin" aria-hidden="true">{{SIGN}}</span></template>

<template data-part="tier-badge"><span class="tier tier-wide" data-tier="{{TIER}}" data-tip="{{TIP}}">{{LABEL}} tier</span></template>
