<main>
<h1>Commander decks</h1>
<p class="lede">{{COUNT}} decks, each validated to 100 cards, single colour
identity and the Game&nbsp;Changer cap for its bracket. Pick one to see the list,
hover a card to preview it, click to enlarge.</p>
{{SECTIONS}}
</main>

<template data-part="section">
<section>
  <h2>{{BRACKET}} <span class="count">{{N}}</span></h2>
  <div class="tiles">
{{TILES}}  </div>
</section>
</template>

<template data-part="tile">
    <a class="tile" href="{{HREF}}" data-search="{{SEARCH}}">
      {{ART}}
      <span class="tile-body">
        <span class="tile-name">{{NAME}}</span>
        <span class="tile-cmd">{{COMMANDER}}</span>
{{AUTHOR}}        <span class="tile-meta">{{PIPS}}<span class="chip" data-tip="Every card including the commander. Commander decks are exactly 100.">{{TOTAL}} cards</span><span class="chip" data-tip="Lands in the deck. Most Commander decks run 34-38.">{{LANDS}} lands</span><span class="chip" data-tip="MV = mana value, what a card costs in total. This is the average across the nonland cards, so it says roughly how fast the deck is.">MV {{MV}}</span><span class="chip gc" data-tip="GC = Game Changer, a card on Wizards' list of the most powerful in the format. Shown as used / allowed for the bracket.">GC {{GC}}</span></span>
      </span>
    </a>
</template>
