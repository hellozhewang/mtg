<main>
<h1>Commander decks</h1>
<p class="lede">Explore Commander decks by strategy, from prison and Voltron to
tribal armies and spell engines. Each strategy is divided into brackets.
Filter by any theme to find decks that combine several plans.</p>
<div class="catalog-controls">
  <label class="strategy-label" for="strategy-filter">Strategy or theme
    <select id="strategy-filter" class="strategy-filter">
      <option value="">All strategies</option>
{{OPTIONS}}    </select>
  </label>
  <button class="btn clear-filters" type="button" hidden>Clear filters</button>
  <span class="catalog-results" role="status" aria-live="polite" aria-atomic="true">{{COUNT}} decks</span>
<div class="toolbar catalog-views" role="group" aria-label="Catalog view">
  <button class="btn" data-decks="tiles" aria-pressed="true">Tiles</button>
  <button class="btn" data-decks="list" aria-pressed="false">List</button>
</div>
</div>
<div class="decks" data-view="tiles">
{{SECTIONS}}</div>
</main>

<template data-part="strategy">
<section class="strategy-group" data-theme="{{THEME}}">
  <div class="strategy-heading">
    <h2>{{LABEL}} <span class="count" data-section-count>{{N}}</span></h2>
    <p>{{DESCRIPTION}}</p>
  </div>
{{BRACKETS}}</section>
</template>

<template data-part="bracket">
<section class="bracket-group" data-bracket="{{BRACKET_ID}}">
  <h3>{{BRACKET}} <span class="count" data-section-count>{{N}}</span></h3>
  <div class="tiles">
{{TILES}}  </div>
</section>
</template>

<template data-part="tile">
    <a class="tile" href="{{HREF}}" data-search="{{SEARCH}}" data-themes="{{THEMES}}">
      {{ART}}
      <span class="tile-body">
        <span class="tile-name">{{NAME}}</span>
        <span class="tile-cmd">{{COMMANDER}}</span>
{{AUTHOR}}        <span class="tile-themes" aria-label="Deck strategies">{{THEME_TAGS}}</span>
        <span class="tile-meta">{{PIPS}}{{TAG}}{{CREATED}}<span class="chip" data-tip="Every card including the commander. Commander decks are exactly 100.">{{TOTAL}} cards</span><span class="chip" data-tip="Lands in the deck. Most Commander decks run 34-38.">{{LANDS}} lands</span><span class="chip" data-tip="MV = mana value, what a card costs in total. This is the average across the nonland cards, so it says roughly how fast the deck is.">MV {{MV}}</span><span class="chip gc" data-tip="GC = Game Changer, a card on Wizards' list of the most powerful in the format. Shown as used / allowed for the bracket.">GC {{GC}}</span></span>
      </span>
    </a>
</template>

<template data-part="theme-tag"><span class="theme-tag">{{LABEL}}</span></template>
<template data-part="theme-option">      <option value="{{VALUE}}">{{LABEL}} ({{N}})</option>
</template>

<template data-part="tag"><span class="chip private" data-tip="Not published. This deck lives in private/ and appears only in the local build of this site.">private</span></template>
