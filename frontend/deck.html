<main class="deck">
<h1>{{NAME}}</h1>
<p class="sub">{{PIPS}}<span class="cmd">{{COMMANDER}}</span><span class="bracket" data-tip="Power level the deck is built to. Higher brackets allow more Game Changers, land denial and fast combos.">{{BRACKET}}</span>{{TAG}}</p>
<ul class="stats">
  <li data-tip="Every card in the deck, including the commander. Commander decks are exactly 100."><b>{{TOTAL}}</b>cards</li>
  <li data-tip="{{LANDNOTE}}"><b>{{LANDS}}</b>lands</li>
  <li data-tip="MV = mana value, what a card costs in total. This is the average across the nonland cards, so it says roughly how fast the deck is."><b>{{MV}}</b>avg MV</li>
  <li data-tip="GC = Game Changer, a card on Wizards' list of the most powerful in the format. Bracket 3 allows at most 3, and the commander counts."><b>{{GC}}</b>Game Changers</li>
</ul>
{{GCLIST}}{{WARN}}
<div class="curve" aria-label="Mana curve, nonland cards">
{{CURVE}}</div>

<div class="toolbar">
  <button class="btn" data-view="list" aria-pressed="true">List</button>
  <button class="btn" data-view="gallery" aria-pressed="false">Gallery</button>
  <button class="btn" data-copy>Copy decklist</button>
{{LINKS}}
</div>
<textarea class="rawlist" readonly aria-hidden="true" tabindex="-1">{{RAWLIST}}</textarea>

<div class="cards" data-view="list">
{{SECTIONS}}</div>
</main>

<template data-part="links">
  <a class="btn" href="{{RAW}}" target="_blank" rel="noopener">Plain text &#8599;</a>
  <a class="btn" href="{{BLOB}}" target="_blank" rel="noopener">On GitHub &#8599;</a>
</template>

<template data-part="private-note">
  <span class="btn btn-off" data-tip="This deck has not been pushed, so there is nothing to link to on GitHub. Copy decklist still works — the list is in this page.">Not on GitHub</span>
</template>

<template data-part="tag"><span class="chip private" data-tip="Not published. This deck lives in private/ and appears only in the local build of this site.">private</span></template>

<template data-part="gclist">
<p class="gclist">{{NAMES}}</p>
</template>

<template data-part="gcname"><span class="gcname" data-tip="Game Changer — one of the format's most powerful cards. Bracket 3 allows 3.">{{NAME}}</span></template>

<template data-part="warn">
<p class="warn">Not resolved on Scryfall: {{NAMES}}</p>
</template>

<template data-part="bar">
  <span class="bar" title="{{N}} cards at mana value {{MV}}"><span class="fill" style="height:{{PCT}}%"></span><span class="n">{{LABEL}}</span><span class="mv">{{MV}}</span></span>
</template>

<template data-part="section">
<section class="cat">
  <h2>{{NAME}} <span class="count">{{N}}</span></h2>
  <ul class="cardlist">
{{CARDS}}  </ul>
</section>
</template>

<template data-part="card">
    <li class="{{CLASS}}" data-name="{{NAME}}"{{DATA}} tabindex="0"><span class="qty">{{QTY}}</span><span class="cname">{{NAME}}</span>{{GCFLAG}}<span class="cost">{{COST}}</span></li>
</template>
