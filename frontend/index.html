<main>
<h1>Commander decks</h1>
<p class="lede">Browse decks by bracket in List, or explore collapsible strategy
groups in Categories. Filter by any theme to find decks that combine several plans.</p>
<div class="catalog-controls">
  <label class="strategy-label" for="strategy-filter">Strategy or theme
    <select id="strategy-filter" class="strategy-filter">
      <option value="">All strategies</option>
{{OPTIONS}}    </select>
  </label>
  <button class="btn clear-filters" type="button" hidden>Clear filters</button>
  <span class="catalog-results" role="status" aria-live="polite" aria-atomic="true">{{COUNT}} decks</span>
<div class="toolbar catalog-views" role="group" aria-label="Catalog view">
  <button class="btn" data-grouping="list" aria-pressed="true">List</button>
  <button class="btn" data-grouping="categories" aria-pressed="false">Categories</button>
</div>
</div>
<div class="catalog-display">
  <div class="toolbar catalog-layout" role="group" aria-label="Deck layout">
    <span class="control-label">Layout</span>
    <button class="btn" data-decks="list" aria-pressed="true">Rows</button>
    <button class="btn" data-decks="tiles" aria-pressed="false">Tiles</button>
  </div>
  <div class="category-actions" role="group" aria-label="Category sections" hidden>
    <button class="btn" type="button" data-categories="expand">Expand all</button>
    <button class="btn" type="button" data-categories="collapse">Collapse all</button>
  </div>
</div>
<div class="decks" data-grouping="list" data-view="list">
  <div class="catalog-list">
{{BRACKETS}}  </div>
  <div class="catalog-categories" hidden>
{{CATEGORIES}}  </div>
</div>
</main>

<template data-part="strategy">
<details class="strategy-group" data-theme="{{THEME}}" open>
  <summary class="strategy-heading">
    <span class="strategy-title">{{LABEL}}</span>
    <span class="strategy-description">{{DESCRIPTION}}</span>
  </summary>
{{BRACKETS}}</details>
</template>

<template data-part="list-bracket">
<details class="bracket-group" data-bracket="{{BRACKET_ID}}" open>
  <summary class="bracket-heading"><h2>{{BRACKET}}</h2></summary>
  <div class="tiles">
{{TILES}}  </div>
</details>
</template>

<template data-part="bracket">
<section class="bracket-group" data-bracket="{{BRACKET_ID}}">
  <h3>{{BRACKET}}</h3>
  <div class="tiles">
{{TILES}}  </div>
</section>
</template>

<template data-part="tile">
    <a class="tile" href="{{HREF}}" data-search="{{SEARCH}}" data-themes="{{THEMES}}" data-bracket="{{BRACKET_ID}}"{{PREVIEW}}>
      {{ART}}
      <span class="tile-body">
        <span class="tile-identity">
          <span class="tile-name">{{NAME}}</span>
          <span class="tile-cmd">{{COMMANDER}}</span>
          <span class="tile-byline">{{AUTHOR}}{{TAG}}{{CREATED}}</span>
        </span>
        <span class="tile-colors" aria-label="Color identity">{{PIPS}}</span>
        <span class="tile-themes" aria-label="Deck strategies">{{THEME_TAGS}}</span>
        <span class="tile-meta"><span class="chip" data-tip="Every card including the commander. Commander decks are exactly 100.">{{TOTAL}} cards</span><span class="chip" data-tip="Lands in the deck. Most Commander decks run 34-38.">{{LANDS}} lands</span><span class="chip" data-tip="MV = mana value, what a card costs in total. This is the average across the nonland cards, so it says roughly how fast the deck is.">MV {{MV}}</span><span class="chip gc" data-tip="GC = Game Changer, a card on Wizards' list of the most powerful in the format. Shown as used / allowed for the bracket.">GC {{GC}}</span></span>
      </span>
    </a>
</template>

<template data-part="theme-tag"><span class="theme-tag">{{LABEL}}</span></template>
<template data-part="theme-option">      <option value="{{VALUE}}">{{LABEL}}</option>
</template>

<template data-part="tag"><span class="chip private" data-tip="Not published. This deck lives in private/ and appears only in the local build of this site.">private</span></template>
