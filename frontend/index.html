<main>
<h1>Commander decks</h1>
<p class="lede">{{COUNT}} decks, each validated to 100 cards, single colour
identity and the Game&nbsp;Changer cap for its bracket. Pick one to see the list,
hover a card to preview it, click to enlarge.</p>
{{SECTIONS}}
</main>

<template data-part="section">
<section>
  <h2>{{BRACKET}} <span class="count">{{N}}</span></h2>
  <div class="tiles">
{{TILES}}  </div>
</section>
</template>

<template data-part="tag"><span class="tag-private" title="Local only &mdash; not published to the repo">private</span></template>

<template data-part="tile">
    <a class="tile" href="{{HREF}}">
      {{ART}}
      <span class="tile-body">
        <span class="tile-name">{{NAME}}{{TAG}}</span>
        <span class="tile-cmd">{{COMMANDER}}</span>
        <span class="tile-meta">{{PIPS}}<span class="chip">{{TOTAL}} cards</span><span class="chip">{{LANDS}} lands</span><span class="chip" title="Average mana value of the nonland cards">MV {{MV}}</span><span class="chip gc" title="Game Changers used, out of the bracket cap">GC {{GC}}</span></span>
      </span>
    </a>
</template>
